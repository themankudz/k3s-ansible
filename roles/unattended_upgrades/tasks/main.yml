---
# Install and configure unattended-upgrades. This role owns the whole
# /etc/apt/apt.conf.d/50unattended-upgrades file, including the Mail/MailReport
# directives (previously patched in by mail-setup).

- name: Install unattended-upgrades packages
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - apt-listchanges
    state: present
    update_cache: true
    # See roles/mail_relay/tasks/main.yml for why this is needed: without it,
    # this task reports changed=true on every run purely from the cache
    # refresh, breaking upgrade-k3s.yml's idempotency guarantee.
    cache_valid_time: 3600

- name: Configure periodic apt activities
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Configure unattended-upgrades
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: "0644"

# The unattended-upgrades package ships this drop-in file; we raise the inhibit
# delay so an in-progress upgrade is not cut short on shutdown.
- name: Raise unattended-upgrades logind inhibit delay
  ansible.builtin.lineinfile:
    line: InhibitDelayMaxSec=90
    regexp: "^InhibitDelayMaxSec.*"
    state: present
    insertafter: EOF
    path: /usr/lib/systemd/logind.conf.d/unattended-upgrades-logind-maxdelay.conf
  tags: inhibit
