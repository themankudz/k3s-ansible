---
- name: Create manifests directory on first master
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/server/manifests
    state: directory
    owner: root
    group: root
    mode: "0644"
  when: inventory_hostname == k3s_server_addon_master

- name: Download vip cloud provider manifest to first master
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/kube-vip/kube-vip-cloud-provider/{{ kube_vip_cloud_provider_tag_version | default('v0.0.12') }}/manifest/kube-vip-cloud-controller.yaml # noqa yaml[line-length]
    dest: /var/lib/rancher/k3s/server/manifests/kube-vip-cloud-controller.yaml
    owner: root
    group: root
    mode: "0644"
  register: kube_vip_manifest_download
  retries: "{{ download_retries }}"
  delay: "{{ download_delay }}"
  until: kube_vip_manifest_download is succeeded
  when: inventory_hostname == k3s_server_addon_master

- name: Copy kubevip configMap manifest to first master
  ansible.builtin.template:
    src: kubevip.yaml.j2
    dest: /var/lib/rancher/k3s/server/manifests/kubevip.yaml
    owner: root
    group: root
    mode: "0644"
  when: inventory_hostname == k3s_server_addon_master

- name: Keep the kube-vip cloud provider manifests on the primary master only
  ansible.builtin.include_tasks: primary-only-manifests.yml
  vars:
    k3s_server_primary_only_manifests: [kube-vip-cloud-controller.yaml, kubevip.yaml]
