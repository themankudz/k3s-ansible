---
- name: Create manifests directory on first master
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/server/manifests
    state: directory
    owner: root
    group: root
    mode: "0644"
  when: inventory_hostname == k3s_server_addon_master

- name: "Download to first master: manifest for metallb-{{ metal_lb_type }}"
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/metallb/metallb/{{ metal_lb_controller_tag_version }}/config/manifests/metallb-{{ metal_lb_type }}.yaml # noqa yaml[line-length]
    dest: /var/lib/rancher/k3s/server/manifests/metallb-crds.yaml
    owner: root
    group: root
    mode: "0644"
  register: metallb_manifest_download
  retries: "{{ download_retries }}"
  delay: "{{ download_delay }}"
  until: metallb_manifest_download is succeeded
  when: inventory_hostname == k3s_server_addon_master

- name: Set image versions in manifest for metallb-{{ metal_lb_type }}
  ansible.builtin.replace:
    path: /var/lib/rancher/k3s/server/manifests/metallb-crds.yaml
    regexp: "{{ item.change | ansible.builtin.regex_escape }}"
    replace: "{{ item.to }}"
  with_items:
    - change: metallb/speaker:{{ metal_lb_controller_tag_version }}
      to: metallb/speaker:{{ metal_lb_speaker_tag_version }}
  loop_control:
    label: "{{ item.change }} => {{ item.to }}"
  when: inventory_hostname == k3s_server_addon_master

# Extra speaker tolerations go into the manifest file itself, not a kubectl
# patch: k3s re-applies every file in server/manifests at each start (seen in
# k3s-7's journal), which would reset a patched DaemonSet. They are inserted
# after the speaker's upstream control-plane toleration (the only one in the
# file since at least v0.14) between marker comments, so a re-run, a changed
# list or an empty list rewrites exactly that block -- and a freshly
# downloaded manifest simply gets it again.
- name: Set extra MetalLB speaker tolerations in the manifest
  ansible.builtin.replace:
    path: /var/lib/rancher/k3s/server/manifests/metallb-crds.yaml
    regexp: >-
      ^(        key: node-role\.kubernetes\.io/control-plane\n        operator: Exists\n)(?:      # BEGIN
      metal_lb_speaker_extra_tolerations\n(?:.*\n)*?      # END metal_lb_speaker_extra_tolerations\n)?
    replace: "\\g<1>{{ metallb_speaker_tolerations_block }}"
  vars:
    metallb_speaker_tolerations_block: >-
      {{ ('      # BEGIN metal_lb_speaker_extra_tolerations\n'
          ~ (metal_lb_speaker_extra_tolerations | to_nice_yaml(indent=2) | indent(6, true))
          ~ '      # END metal_lb_speaker_extra_tolerations\n')
         if metal_lb_speaker_extra_tolerations | length > 0 else '' }}
  when: inventory_hostname == k3s_server_addon_master

- name: Read back MetalLB manifest from first master
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/manifests/metallb-crds.yaml
  register: metallb_manifest
  when: inventory_hostname == k3s_server_addon_master

- name: Check the MetalLB speaker image reference is present
  ansible.builtin.set_fact:
    metallb_manifest_has_speaker_tag: >-
      {{
        ('quay.io/metallb/speaker:' ~ metal_lb_speaker_tag_version) in
        (metallb_manifest.content | default('') | b64decode)
      }}
  when: inventory_hostname == k3s_server_addon_master

- name: Fail if MetalLB speaker tag was not applied to the manifest
  ansible.builtin.fail:
    msg: >-
      MetalLB speaker image reference
      quay.io/metallb/speaker:{{ metal_lb_speaker_tag_version }}
      was not found in the downloaded manifest. The upstream image
      reference may have changed.
  when:
    - inventory_hostname == k3s_server_addon_master
    - not metallb_manifest_has_speaker_tag

- name: Fail if the extra MetalLB speaker tolerations were not written to the manifest
  ansible.builtin.fail:
    msg: >-
      metal_lb_speaker_extra_tolerations is set, but the manifest has no
      "# BEGIN metal_lb_speaker_extra_tolerations" block: the speaker's
      upstream control-plane toleration (the anchor) was not found. The
      upstream manifest layout may have changed.
  when:
    - inventory_hostname == k3s_server_addon_master
    - metal_lb_speaker_extra_tolerations | length > 0
    - not ansible_check_mode
    - "'# BEGIN metal_lb_speaker_extra_tolerations' not in (metallb_manifest.content | default('') | b64decode)"

- name: Keep the MetalLB manifests on the primary master only
  ansible.builtin.include_tasks: primary-only-manifests.yml
  vars:
    k3s_server_primary_only_manifests: [metallb-crds.yaml]
