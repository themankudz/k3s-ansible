---
- name: Set _kube_vip_bgp_peers fact
  ansible.builtin.set_fact:
    _kube_vip_bgp_peers: "{{ lookup('community.general.merge_variables', '^kube_vip_bgp_peers__.+$', initial_value=kube_vip_bgp_peers, groups=kube_vip_bgp_peers_groups) }}"  # yamllint disable-line rule:line-length

- name: Create manifests directory on first master
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/server/manifests
    state: directory
    owner: root
    group: root
    mode: "0644"
  when: inventory_hostname == k3s_server_addon_master

- name: Copy kube-vip RBAC manifest to first master
  ansible.builtin.template:
    src: kube-vip-rbac.yaml.j2
    dest: /var/lib/rancher/k3s/server/manifests/vip-rbac.yaml
    owner: root
    group: root
    mode: "0644"
  when: inventory_hostname == k3s_server_addon_master

- name: Copy vip manifest to first master
  ansible.builtin.template:
    src: vip.yaml.j2
    dest: /var/lib/rancher/k3s/server/manifests/vip.yaml
    owner: root
    group: root
    mode: "0644"
  when: inventory_hostname == k3s_server_addon_master

- name: Keep the kube-vip manifests on the primary master only
  ansible.builtin.include_tasks: primary-only-manifests.yml
  vars:
    k3s_server_primary_only_manifests: [vip-rbac.yaml, vip.yaml]
