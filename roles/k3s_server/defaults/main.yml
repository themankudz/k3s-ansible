---
extra_server_args: ""

k3s_kubectl_binary: k3s kubectl

group_name_master: master

# The master that owns the addon manifests (kube-vip, MetalLB) in
# server/manifests. Not groups[group_name_master][0]: when a host sits in two
# child groups of [master] (primary-master and pi-master), that group has no
# stable order -- ansible-core 2.21 returned k3s-1 or k3s-7 first at random --
# so each run could write the manifests to a different master. A primary-master
# host that isn't in group_name_master is ignored (falls back to its first host).
k3s_server_addon_master: >-
  {{ (groups['primary-master'] | default([]) | intersect(groups[group_name_master])
      or groups[group_name_master]) | first }}

kube_vip_arp: true
kube_vip_iface:
kube_vip_endpoint:
kube_vip_cloud_provider_tag_version: v0.0.12
kube_vip_tag_version: v1.2.4

kube_vip_bgp: false
kube_vip_bgp_routerid: 127.0.0.1
kube_vip_bgp_as: "64513"
kube_vip_bgp_peeraddress: 192.168.30.1
kube_vip_bgp_peeras: "64512"

kube_vip_bgp_peers: []
kube_vip_bgp_peers_groups: ['k3s_master']

kube_vip_enabled: true

metal_lb_enabled: true
metal_lb_controller_tag_version: v0.16.1
metal_lb_speaker_tag_version: v0.16.1
metal_lb_type: native
# Extra tolerations for the MetalLB speaker DaemonSet (Kubernetes toleration
# objects), written into the downloaded manifest by tasks/metallb.yml so every
# k3s apply of it -- including the one at each k3s start -- keeps them.
# Empty = upstream manifest as-is.
metal_lb_speaker_extra_tolerations: []
# Where tasks/metallb.yml builds the manifest before copying it into
# server/manifests (k3s must never see it half-edited). Not under manifests/.
metallb_manifest_build: /var/lib/rancher/k3s/server/metallb-crds.build.yaml

# Shared retry/delay for remote manifest and asset downloads. The CI runner's
# resolver intermittently times out on GitHub-hosted domains (helm.cilium.io,
# raw.githubusercontent.com, github.com), so retry transient DNS/network failures.
download_retries: 5
download_delay: 10

retry_count: 20

# yamllint disable rule:line-length
server_init_args: >-
  {% if groups[group_name_master | default('primary-master')] | length > 1 %}
    {% if ansible_facts['hostname'] == hostvars[groups[group_name_master | default('primary-master')][0]]['ansible_facts']['hostname'] %}
      --cluster-init
    {% else %}
      --server https://{{ hostvars[groups[group_name_master | default('primary-master')][0]].k3s_node_ip | split(",") | first | ansible.utils.ipwrap }}:6443
    {% endif %}
    --token {{ k3s_token | replace('%', '%%') }}
  {% endif %}
  {{ extra_server_args }}

systemd_dir: /etc/systemd/system
