---
# Install otelcol-contrib from the GitHub release .deb and point it at SigNoz.

- name: Map host architecture to release arch
  ansible.builtin.set_fact:
    _otelcol_arch: "{{ _otelcol_arch_map[ansible_facts['architecture']] | default(ansible_facts['architecture']) }}"
  vars:
    _otelcol_arch_map:
      aarch64: arm64
      x86_64: amd64

- name: Check installed otelcol-contrib version
  ansible.builtin.command: dpkg-query -W -f='${Version}' otelcol-contrib
  register: _otelcol_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install otelcol-contrib .deb
  ansible.builtin.apt:
    deb: "{{ _otelcol_deb_url }}"
  vars:
    _otelcol_base: "https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download"
    _otelcol_file: "otelcol-contrib_{{ otelcol_version }}_linux_{{ _otelcol_arch }}.deb"
    _otelcol_deb_url: "{{ _otelcol_base }}/v{{ otelcol_version }}/{{ _otelcol_file }}"
  register: _otelcol_deb
  when: _otelcol_installed.stdout != otelcol_version

# Run the agent as its own user but grant journal + log read access so the
# journald and filelog receivers work without running as root.
- name: Grant otelcol-contrib access to journal and logs
  ansible.builtin.user:
    name: otelcol-contrib
    groups:
      - systemd-journal
      - adm
    append: true
  notify: Restart otelcol-contrib

# Extra log files may sit under root-only directories (k3s keeps
# /var/lib/rancher/k3s/agent at 0700). Grant the agent user traverse (x) on
# the parent directories only -- the files themselves are already 0644 -- so
# it can open them without the collector running as root.
- name: Install acl for directory traverse grants
  ansible.builtin.apt:
    name: acl
    state: present
  register: _otelcol_acl_pkg
  when: node_monitoring_traverse_dirs | length > 0

# A directory that doesn't exist yet is skipped: on a node that isn't running
# k3s yet (join-agent.yml applies this baseline before k3s starts) k3s only
# creates agent/containerd at first start. join-agent.yml runs this role again
# once the node is up; the next upgrade-k3s.yml run would catch it too.
- name: Find which log parent directories exist
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ node_monitoring_traverse_dirs }}"
  register: _otelcol_traverse_dirs

- name: Note log parent directories that don't exist (yet)
  ansible.builtin.debug:
    msg: >-
      Skipping traverse ACLs on missing {{ _otelcol_missing_dirs | join(', ') }}
      -- expected before k3s first starts, otherwise check node_monitoring_traverse_dirs.
  vars:
    _otelcol_missing_dirs: >-
      {{ _otelcol_traverse_dirs.results | rejectattr('stat.exists')
         | map(attribute='item') | list }}
  when: _otelcol_missing_dirs | length > 0

# Skipped in check mode when acl would only just have been installed
# (setfacl isn't really there yet, so the module can't run).
- name: Grant otelcol-contrib traverse access to log parent directories
  ansible.posix.acl:
    path: "{{ item.item }}"
    entity: otelcol-contrib
    etype: user
    permissions: x
    state: present
  loop: "{{ _otelcol_traverse_dirs.results | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item }}"
  when: not (ansible_check_mode and _otelcol_acl_pkg is changed)

# k3s chmods agent/containerd back to 0700 at every start, and chmod rewrites
# the ACL mask, so the grant above stays masked to nothing until the next run.
# A drop-in re-grants it after each start (setfacl recalculates the mask). It
# only needs a daemon-reload: the grant above already covers the running k3s,
# and the drop-in applies from the next start, which is when it's needed.
# ExecStartPost runs at READY; on every node the chmod came 4-6s before that
# (unit active vs the dir's ctime, all 8 nodes, 2026-10-29).
- name: Set the k3s unit drop-in path
  ansible.builtin.set_fact:
    _otelcol_dropin_dir: "{{ systemd_dir | default('/etc/systemd/system') }}/{{ node_monitoring_k3s_unit }}.service.d"
  when: node_monitoring_k3s_unit | length > 0

- name: Create the k3s unit drop-in directory
  ansible.builtin.file:
    path: "{{ _otelcol_dropin_dir }}"
    state: directory
    mode: "0755"
  when:
    - node_monitoring_k3s_unit | length > 0
    - node_monitoring_traverse_dirs | length > 0

- name: Re-grant the traverse ACLs after every k3s start
  ansible.builtin.template:
    src: k3s-log-acl.conf.j2
    dest: "{{ _otelcol_dropin_dir }}/60-otelcol-log-acl.conf"
    mode: "0644"
  register: _otelcol_acl_dropin
  when:
    - node_monitoring_k3s_unit | length > 0
    - node_monitoring_traverse_dirs | length > 0

# Also clears the other unit's copy (a node that changed role) and both when
# node_monitoring_k8s_node is turned off.
- name: Remove ACL drop-ins that no longer apply
  ansible.builtin.file:
    path: "{{ systemd_dir | default('/etc/systemd/system') }}/{{ item }}.service.d/60-otelcol-log-acl.conf"
    state: absent
  loop: >-
    {{ ['k3s', 'k3s-node']
       | difference([node_monitoring_k3s_unit] if node_monitoring_traverse_dirs | length > 0 else []) }}
  register: _otelcol_acl_dropin_removed

- name: Reload systemd for the ACL drop-in
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - _otelcol_acl_dropin is changed or _otelcol_acl_dropin_removed is changed
    - not ansible_check_mode

- name: Template otelcol-contrib config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/otelcol-contrib/config.yaml
    owner: root
    group: otelcol-contrib
    mode: "0640"
  notify: Restart otelcol-contrib

# Skipped in check mode on a fresh install (the unit isn't really there yet).
- name: Enable and start otelcol-contrib
  ansible.builtin.systemd:
    name: otelcol-contrib
    enabled: true
    state: started
    daemon_reload: true
  when: not (ansible_check_mode and _otelcol_deb is changed)
