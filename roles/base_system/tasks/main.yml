---
# Generic OS baseline for any Debian/Ubuntu VM.
# Extracted from roles/prereq (the k3s path) but stripped of k3s specifics.

- name: Set the system timezone
  community.general.timezone:
    name: "{{ system_timezone }}"
  when:
    - system_timezone is defined
    - system_timezone != "Your/Timezone"

- name: Add apt-cacher proxy settings
  ansible.builtin.template:
    src: apt-proxy
    dest: /etc/apt/apt.conf.d/00aptproxy
    owner: root
    group: root
    mode: "0644"
  tags: apt-cacher
  when:
    - ansible_facts['os_family'] == "Debian"
    - apt_proxy_http_url is defined

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    # See roles/mail_relay/tasks/main.yml for why this is needed: without it,
    # this task reports changed=true on every run purely from the cache
    # refresh, even when base_packages is already fully converged.
    cache_valid_time: 3600
  when: base_packages | length > 0

- name: Enable IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    state: present
    reload: true
  tags: sysctl
  when: base_ip_forward | bool
