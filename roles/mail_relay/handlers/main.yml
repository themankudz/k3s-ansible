---
- name: Run postmap on sasl_passwd
  ansible.builtin.command: postmap /etc/postfix/sasl_passwd
  args:
    creates: /etc/postfix/sasl_passwd.db

# Skipped in check mode on a fresh host (the unit isn't really there yet).
- name: Restart postfix
  ansible.builtin.systemd_service:
    name: postfix
    state: restarted
    daemon_reload: true
  when: not (ansible_check_mode and (mail_relay_packages | default({})) is changed)
