---
disable_swap: true

secure_path:
  RedHat: /sbin:/bin:/usr/sbin:/usr/bin:/usr/local/bin
  Suse: /usr/sbin:/usr/bin:/sbin:/bin:/usr/local/bin

# --- node log/disk hygiene (tasks/node-hygiene.yml) --------------------------
# journald is the only system logger on the nodes; rsyslog just mirrors it into
# an uncapped /var/log/syslog (4-7G/node during the 2026-09-17/18 outage).
disable_rsyslog: true
journald_system_max_use: 500M
journald_system_max_file_size: 100M
# Kernel defaults are 128 / 8192 -- exhausted on a busy k3s node.
inotify_max_user_instances: 1024
inotify_max_user_watches: 1048576
# console_loglevel: keep err-level kernel messages off the VM's emulated
# console. 3 prints emerg/alert/crit only, so panics and oopses still reach it;
# nothing is lost from the ring buffer, journald or SigNoz either way.
# NOTE: this is hygiene only. It does NOT stop k3s-w1's QXL video model spamming
# "failed to allocate VRAM BO" -- tested 2026-09-19, the bursts continued every
# 15-16s with console_loglevel=3, so the trigger is periodic framebuffer access
# (fbcon/agetty on tty1), not the printing of the messages themselves. The fix
# for that is changing the VM's <video model type='qxl'> to virtio in Unraid.
console_loglevel: 3

# --- SD-card nodes (node_sd_card: true) --------------------------------------
# Keep logs in RAM so they don't wear out an SD card; SigNoz holds the history
# (node_monitoring switches its journald receivers to /run/log/journal when
# node_sd_card is set; the k8s-infra otel-agent reads /var/log/pods). A reboot
# while SigNoz is unreachable loses that window's node logs -- accepted. Turning this off again leaves the tmpfs
# fstab line and the mount in place; remove them by hand and reboot.
node_sd_card: false
# journald Storage=volatile: the journal lives in /run only.
journald_runtime_max_use: 64M
journald_runtime_max_file_size: 16M
# tmpfs for /var/log/pods. Only the logs actually written use RAM; with the
# rotation below that is ~10Mi per container at most.
node_sd_card_pod_logs_size: 256M
# kubelet container-log rotation for SD-card nodes only (kubelet drop-in,
# needs a k3s restart -- tasks/runtime-config.yml).
node_sd_card_container_log_max_size: 5Mi
node_sd_card_container_log_max_files: 2

# k3s-node-guard: hourly timer that removes containerd leases older than
# node_guard_lease_max_age_hours (leftovers of interrupted pulls -- containerd
# has no config for lease expiry; complete images are never touched) and,
# only when the root fs is at/over
# node_guard_disk_pressure_pct, purges node_guard_purge_dirs and vacuums the
# journal. It never prunes images: kubelet's image GC does that at 85%.
# The threshold sits just under kubelet's soft eviction line (10% free).
# Opt-in.
node_guard_enabled: false
node_guard_lease_max_age_hours: 2
node_guard_disk_pressure_pct: 88
# Globs allowed (expanded by the script). The k8s-infra otel-agent's queue is
# an emptyDir since 2026-09-19 (20Gi sizeLimit, 4GiB byte cap per signal), so this is a
# last resort behind kubelet's own accounting -- but under real node disk
# pressure the buffer is still the right thing to sacrifice.
node_guard_purge_dirs:
  - "/var/lib/kubelet/pods/*/volumes/kubernetes.io~empty-dir/otel-agent-queue"
node_guard_journal_vacuum_size: 300M
node_guard_tempdb_max_age_min: 60

# --- /etc/hosts pins (tasks/static-hosts.yml) --------------------------------
# Hostnames with fixed IPs that image pulls must resolve without DNS. Both
# Pi-holes run on the management cluster, so without these a DNS outage makes
# both Harbors unreachable together. Must match homelab-k3s pihole/values.yaml.
# An empty list removes the managed block.
static_hosts:
  - ip: 192.168.50.228   # workload internal-nginx (Harbor)
    names: [harbor.homecluster.co]
  - ip: 192.168.50.215   # management internal-nginx
    names: [harbor-mgmt.homecluster.co]
