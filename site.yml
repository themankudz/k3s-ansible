---
# site.yml is bootstrap-only: against an established cluster k3s_server stops
# k3s on every master at once and re-inits the first one alone, which can't
# reach etcd quorum (full outage 2026-09-05). Refuse before anything changes.
# Tagged always so --tags can't skip it; reset.yml clears the state it checks.
# hosts: all, so an unreachable master stops the agents too (any_errors_fatal
# only covers this play's hosts).
- name: Refuse to run against an established cluster
  hosts: all
  gather_facts: false
  become: true
  any_errors_fatal: true
  tags: always
  tasks:
    - name: Fail if --limit leaves out a master
      ansible.builtin.fail:
        msg: >-
          site.yml needs every master ({{ groups['master'] | difference(ansible_play_hosts_all) | join(', ') }}
          left out) to tell whether the cluster already exists. To add an agent
          to a live cluster use join-agent.yml.
      run_once: true
      when:
        - not (site_allow_existing_cluster | default(false) | bool)
        - groups['master'] | difference(ansible_play_hosts_all) | length > 0

    - name: Check for existing k3s server state
      ansible.builtin.stat:
        path: /var/lib/rancher/k3s/server/db
      register: site_k3s_server_db
      when:
        - not (site_allow_existing_cluster | default(false) | bool)
        - inventory_hostname in groups['master']

    - name: Fail if this master already belongs to a cluster
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }} already has k3s server state
          (/var/lib/rancher/k3s/server/db). site.yml only bootstraps a new
          cluster; use upgrade-k3s.yml for a live one, join-agent.yml to add
          an agent. Only after reset.yml, or with
          -e site_allow_existing_cluster=true if you know why.
      when:
        - not (site_allow_existing_cluster | default(false) | bool)
        - inventory_hostname in groups['master']
        - site_k3s_server_db.stat.exists

- name: Pre tasks
  hosts: all
  pre_tasks:
    - name: Verify Ansible is version 2.11 or above. (If this fails you may need to update Ansible)
      ansible.builtin.assert:
        that: ansible_version.full is version_compare('2.11', '>=')
        msg: >
          "Ansible is out of date. See here for more info: https://docs.technotim.com/posts/ansible-automation/"

    - name: Verify all cluster nodes have unique hostnames
      ansible.builtin.assert:
        that: (cluster_hostnames | unique | length) == (cluster_hostnames | length)
        msg: >-
          k3s nodes must have unique hostnames. Found a duplicate in:
          {{ cluster_hostnames | unique }}. Each node registers in the cluster
          keyed by its hostname, so matching hostnames prevent nodes from joining.
      vars:
        cluster_hostnames: >-
          {{
            groups['k3s_cluster']
            | map('extract', hostvars, ['ansible_facts', 'hostname'])
            | list
          }}
      run_once: true
      when: "'k3s_cluster' in groups"

- name: Prepare Proxmox cluster
  hosts: proxmox
  gather_facts: true
  become: true
  environment: "{{ proxy_env | default({}) }}"
  roles:
    - role: proxmox_lxc
      when: proxmox_lxc_configure

- name: Prepare k3s nodes
  hosts: k3s_cluster
  gather_facts: true
  environment: "{{ proxy_env | default({}) }}"
  roles:
    - role: lxc
      become: true
      when: proxmox_lxc_configure
    - role: prereq
      become: true
    - role: download
      become: true
    - role: raspberrypi
      become: true
    - role: k3s_custom_registries
      become: true
      when: custom_registries
    - role: longhorn_node_fix
      become: true
    - role: node_longhorn
      become: true
      tags: node_longhorn
    - role: node_nfs
      become: true
      tags: node_nfs
    - role: node_bluetooth
      become: true
      tags: node_bluetooth
    - role: mail_relay
      become: true
      when: mail_relay_enabled | default(true) | bool
    - role: unattended_upgrades
      become: true
    - role: node_monitoring
      become: true
      when: node_monitoring_enabled | default(false) | bool

- name: Setup k3s servers
  hosts: master
  vars_files:
    - vars/k3s-primary-master.yml
  environment: "{{ proxy_env | default({}) }}"
  roles:
    - role: k3s_server
      become: true

- name: Setup k3s agents
  hosts: node
  vars_files:
    - vars/k3s-primary-master.yml
  environment: "{{ proxy_env | default({}) }}"
  roles:
    - role: k3s_agent
      become: true

- name: Configure k3s cluster
  hosts: master
  vars_files:
    - vars/k3s-primary-master.yml
  environment: "{{ proxy_env | default({}) }}"
  roles:
    - role: k3s_server_post
      become: true

- name: Storing kubeconfig in the playbook directory
  hosts: master
  vars_files:
    - vars/k3s-primary-master.yml
  environment: "{{ proxy_env | default({}) }}"
  tasks:
    - name: Copying kubeconfig from {{ k3s_primary_master }}
      ansible.builtin.fetch:
        src: "{{ ansible_facts['user_dir'] }}/.kube/config"
        dest: ./kubeconfig
        flat: true
      when: inventory_hostname == k3s_primary_master
