---
# Rolls out kubelet + containerd node-runtime config changes to a live
# cluster one node at a time. Agents restart immediately; masters restart
# after agents to preserve cluster availability. Source files are the same
# ones roles/prereq deploys on a fresh node, so a normal site.yml run and
# this ad-hoc rollout can never drift apart.
- name: Update node runtime config on agent nodes
  hosts: node
  gather_facts: true
  become: true
  serial: 1
  environment: "{{ proxy_env | default({}) }}"
  tasks:
    - name: Deploy kubelet config
      ansible.builtin.copy:
        src: roles/prereq/files/kubelet.config
        dest: /data/k3s/kubelet.config
        backup: true
      notify: Restart k3s-node

    - name: Deploy containerd config template
      ansible.builtin.copy:
        src: roles/prereq/files/containerd-config.toml.tmpl
        dest: /var/lib/rancher/k3s/agent/etc/containerd/config.toml.tmpl
        backup: true
      notify: Restart k3s-node

  handlers:
    - name: Restart k3s-node
      ansible.builtin.service:
        name: k3s-node
        state: restarted

- name: Update node runtime config on master nodes
  hosts: master
  gather_facts: true
  become: true
  serial: 1
  environment: "{{ proxy_env | default({}) }}"
  tasks:
    - name: Deploy kubelet config
      ansible.builtin.copy:
        src: roles/prereq/files/kubelet.config
        dest: /data/k3s/kubelet.config
        backup: true
      notify: Restart k3s

    - name: Deploy containerd config template
      ansible.builtin.copy:
        src: roles/prereq/files/containerd-config.toml.tmpl
        dest: /var/lib/rancher/k3s/agent/etc/containerd/config.toml.tmpl
        backup: true
      notify: Restart k3s

  handlers:
    - name: Restart k3s
      ansible.builtin.service:
        name: k3s
        state: restarted
